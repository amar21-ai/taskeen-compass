<style>
/* Layout: one calm column like a guided interview card; tabs on top, one question per screen, results as a ranked list */
:root{

  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#151d33; --sunk:#1c2640; --fg:#e7ebf5; --muted:#9aa5c2; --line:#2a3655;
  --accent:#7fa2ff; --accent-fg:#0b1430; --accent-soft:#1f2c52; --warm:#ff8196; --warm-soft:#3a1d27;
  --good:#5fd39f; --good-soft:#163428; --warn:#f0b75a; --warn-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#151d33; --sunk:#1c2640; --fg:#e7ebf5; --muted:#9aa5c2; --line:#2a3655;
  --accent:#7fa2ff; --accent-fg:#0b1430; --accent-soft:#1f2c52; --warm:#ff8196; --warm-soft:#3a1d27;
  --good:#5fd39f; --good-soft:#163428; --warn:#f0b75a; --warn-soft:#3a2c12; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
header.top{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--f-display);font-size:.8rem;letter-spacing:.04em;color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
nav.tabs a{font-family:var(--f-display);font-weight:500;text-decoration:none;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{font-family:var(--f-display);font-weight:700;font-size:1rem;border-radius:10px;padding:12px 22px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.progress{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}
.qnum{font-family:var(--f-display);font-size:.85rem;color:var(--muted)}
.opts{display:grid;gap:10px}
label.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.opt input{margin-top:6px;accent-color:var(--accent);flex:none}
label.opt span{min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.scale{display:grid;gap:12px}
.scale .srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.scale .dots{display:flex;gap:4px;direction:ltr}
.scale .dots label{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.scale .dots input{position:absolute;opacity:0;pointer-events:none}
.scale .dots label:has(input:checked){background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.scale .dots label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

.legend{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted)}
.err{color:var(--warm);font-size:.9rem}
/* results */
.pickhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pct{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.rank{font-family:var(--f-display);font-size:.8rem;font-weight:700;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.result{border-inline-start:4px solid var(--accent)}
.result.proj{border-inline-start-color:var(--warm)}
.result.proj .pct{color:var(--warm)}
.result.proj .bar>i{background:var(--warm)}
ul.list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--fg)}
.note{border-radius:12px;padding:12px 14px;font-size:.93rem}
.note.good{background:var(--good-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft);color:var(--fg)}
.note.info{background:var(--accent-soft);color:var(--fg)}
.note b{font-weight:600}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h2{padding-top:8px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mini .m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.mini .m b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
details.ent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
details.ent summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.ent summary::-webkit-details-marker{display:none}
details.ent summary h3{font-size:1.05rem}
details.ent[open] summary{margin-bottom:10px}
.tag{font-size:.75rem;font-family:var(--f-display);padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.p{background:var(--warm-soft);color:var(--warm)}
.ent .body{display:flex;flex-direction:column;gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.9rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-family:var(--f-display);font-weight:500;color:var(--muted);font-size:.82rem}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.92rem}
textarea.copy{width:100%;min-height:140px;font:inherit;font-size:.85rem;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);padding:10px}
</style>
</head>

function buildProfile(a){

    if(q.kind==="single"){ const o=q.opts.find(o=>o.v===ans); if(o&&o.add) add(o.add); }
    if(q.kind==="multi"){ for(const o of q.opts) if(ans.includes(o.v)&&o.add) add(o.add); }
    if(q.kind==="scale"){ for(const it of q.items){ const r=ans[it.d]; if(r) v[it.d]+= (r-1)*1.1; } }

  if(a.info && (a.info.status==="grad")) v.youth+=1;

  const v=buildProfile(a);
  const all=ENT.map(e=>scoreEntity(e,v,a)).sort((x,y)=>y.score-x.score);
  const files=all.filter(r=>byId[r.id].type==="file");
  const projects=all.filter(r=>byId[r.id].type==="project");
  const skillVals = a.skills? Object.values(a.skills):[];
  const lowSkills = skillVals.length && skillVals.every(x=>x<=2);
  const flags=[];
  if(lowSkills || a.exp==="none") flags.push("beginner");
  const lis=Q.find(q=>q.id==="listen").opts.find(o=>o.v===a.listen);
  if(lis&&lis.flag==="promise") flags.push("promise");
  const answered = visibleQs().filter(q=>a[q.id]!=null && !(Array.isArray(a[q.id])&&!a[q.id].length)).length;
  let confidence = answered/visibleQs().length;
  if(a.portfolio && a.portfolio.link) confidence=Math.min(1,confidence+0.05);
  return {profile:v,files,projects,topFiles:files.slice(0,3),topProjects:projects.slice(0,2),flags,confidence,at:new Date().toISOString()};
}

function showErr(t){const e=document.getElementById("err"); if(e){e.textContent=t;e.hidden=false;}}
function collect(q,validate){
  if(q.kind==="info"){
    const i={name:val("f-name"),phone:val("f-phone"),age:val("f-age"),status:val("f-status"),center:val("f-center")};
    A.info=i;
    if(validate && (!i.name||!i.age||!i.status)){showErr("محتاجين اسمك وسنك وانت بتعمل إيه حاليًا.");return false;}
    return true;
  }
  if(q.kind==="single"){ const c=viewQuiz.querySelector(`input[name="q-${q.id}"]:checked`); if(c) A[q.id]=c.value;
    if(validate&&!c){showErr("اختار إجابة عشان نكمل.");return false;} return true;}
  if(q.kind==="multi"){ A[q.id]=[...viewQuiz.querySelectorAll(`input[name="q-${q.id}"]:checked`)].map(x=>x.value);
    if(validate&&q.id!=="commit"&&!A[q.id].length){showErr("اختار حاجة واحدة على الأقل.");return false;} return true;}
  if(q.kind==="scale"){ const o={}; for(const it of q.items){const c=viewQuiz.querySelector(`input[name="s-${it.d}"]:checked`); if(c) o[it.d]=+c.value;}
    A[q.id]=o; if(validate&&Object.keys(o).length<q.items.length){showErr("قيّم نفسك في كل المهارات.");return false;} return true;}
  if(q.kind==="portfolio"){ A.portfolio={types:[...viewQuiz.querySelectorAll(`input[name="q-portfolio"]:checked`)].map(x=>x.value),link:val("f-link")}; return true;}
  return true;
}

/* ============ DB (save + committee) ============ */
let db=null, user=null, uid=null, saveStatus="pending";
(async()=>{
  try{ if(!window.claude||!window.claude.use){saveStatus="off";updateSaveState();return;}
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){ try{uid=await user.id();}catch(e){} }
    if(!db||!uid){saveStatus="off";updateSaveState();return;}
    saveStatus="ready"; if(lastResult) saveSubmission(); else updateSaveState();
    let admin=false; try{admin=await user.canEdit();}catch(e){}
    if(admin){ document.getElementById("tabCommittee").hidden=false; startCommittee(); }
  }catch(e){saveStatus="off";updateSaveState();}
})();
async function saveSubmission(){
  if(!lastResult) return;
  if(saveStatus!=="ready"&&saveStatus!=="saved"&&saveStatus!=="error"){updateSaveState();return;}
  if(!db||!uid){saveStatus="off";updateSaveState();return;}
  saveStatus="saving"; updateSaveState();
  const R=lastResult;
  const doc={info:A.info||{},fav:A.fav||null,portfolio:A.portfolio||null,answers:A,
    topFiles:R.topFiles.map(r=>({id:r.id,pct:r.pct})),topProjects:R.topProjects.map(r=>({id:r.id,pct:r.pct})),
    allScores:Object.fromEntries(R.files.concat(R.projects).map(r=>[r.id,r.pct])),
    flags:R.flags,confidence:Math.round(R.confidence*100),at:R.at};
  try{ await db.collection("submissions").doc(uid).set(doc); saveStatus="saved"; }
  catch(e){ saveStatus="error"; }
  updateSaveState();
}
function updateSaveState(){
  const el=document.getElementById("saveState"); if(!el) return;
  el.textContent = {pending:"جاري حفظ نتيجتك للجنة...",ready:"جاري الحفظ...",saving:"جاري الحفظ...",
    saved:"✓ نتيجتك اتحفظت، ولجنة التسكين تقدر تشوفها.",
    error:"مقدرناش نحفظ نتيجتك أوتوماتيك. انسخ الملخص اللي تحت وابعته للجنة.",
    off:"الحفظ الأوتوماتيك مش متاح هنا. انسخ الملخص اللي تحت وابعته للجنة."}[saveStatus]||"";
}
let committeeRows=[], committeeState="loading";
function startCommittee(){
  const t=setTimeout(()=>{ if(committeeState==="loading"){committeeState="slow";renderCommittee();} },10000);
  db.collection("submissions").onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(t);
    committeeRows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||"").localeCompare(a.at||""));
    committeeState=snap.metadata.fromCache?"cached":"live"; renderCommittee();
  },err=>{clearTimeout(t);committeeState="error";renderCommittee();});
  renderCommittee();
}

  v.innerHTML=`<section class="card"><h2>ردود المتطوعين</h2>
    <p class="muted">${toArabicNum(rows.length)} متطوع جاوبوا. الصفحة دي ظاهرة لمسؤولي الصفحة بس.</p>${status?`<p class="small muted">${status}</p>`:""}
    ${rows.length?`<div><b>توزيع أول ترشيح على الملفات</b> <span class="small muted">(سياسة التوزيع: ملف واحد ميزيدش عن 25٪)</span><div class="mini" style="margin-top:8px">${ENT.filter(e=>e.type==="file").map(e=>{const c=counts[e.id]||0;const p=rows.length?Math.round(c/rows.length*100):0;return `<div class="m"><span>${esc(e.name)}</span><b style="${p>25?"color:var(--warm)":""}">${toArabicNum(c)} · ${toArabicNum(p)}٪</b></div>`}).join("")}</div></div>`:""}
    <div class="row"><button class="btn ghost" id="copyTsv" type="button" ${rows.length?"":"disabled"}>انسخ كجدول لـ Google Sheets</button></div>
    <textarea class="copy" id="tsv" readonly hidden></textarea></section>
    ${rows.length?`<div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الموبايل</th><th>السن / المركز</th><th>أنسب 3 ملفات</th><th>أنسب مشروعين</th><th>كان في دماغه</th><th>التاريخ</th></tr></thead><tbody>
    ${rows.map(r=>{const i=r.info||{};return `<tr><td>${esc(i.name)}</td><td dir="ltr">${esc(i.phone)}</td><td>${esc(i.age)} · ${esc(i.center)}</td>
      <td>${(r.topFiles||[]).map(f=>`${esc(byId[f.id]?.name)} <span class="muted">${toArabicNum(f.pct)}٪</span>`).join("<br>")}</td>
      <td>${(r.topProjects||[]).map(f=>`${esc(byId[f.id]?.name)} <span class="muted">${toArabicNum(f.pct)}٪</span>`).join("<br>")}</td>
      <td>${r.fav&&r.fav!=="none"?esc(byId[r.fav]?.name):"-"}${r.portfolio&&r.portfolio.link?`<br><a href="${esc(r.portfolio.link)}" target="_blank" rel="noopener">أعماله</a>`:""}</td>
      <td class="small">${r.at?new Date(r.at).toLocaleDateString("ar-EG"):""}</td></tr>`}).join("")}</tbody></table></div>`
    :`<section class="card"><p class="muted">لسه مفيش ردود. أول ما متطوع يخلص الأسئلة، نتيجته هتظهر هنا.</p></section>`}`;
  const b=document.getElementById("copyTsv"); if(b) b.onclick=()=>{
    const head=["الاسم","الموبايل","السن","الحالة","المركز","ملف 1","ملف 2","ملف 3","مشروع 1","مشروع 2","كان في دماغه","التاريخ"];
    const lines=rows.map(r=>{const i=r.info||{};const tf=r.topFiles||[],tp=r.topProjects||[];
      return [i.name,i.phone,i.age,i.status,i.center,...[0,1,2].map(k=>tf[k]?`${byId[tf[k].id]?.name} ${tf[k].pct}%`:""),...[0,1].map(k=>tp[k]?`${byId[tp[k].id]?.name} ${tp[k].pct}%`:""),r.fav&&r.fav!=="none"?byId[r.fav]?.name:"",r.at||""].map(x=>String(x??"").replace(/\t|\n/g," ")).join("\t");});
    const t=[head.join("\t")].concat(lines).join("\n"); const ta=document.getElementById("tsv"); ta.value=t; ta.hidden=false; copyText(t,ta);
  };
}

/* ============ ROUTING ============ */
function route(){
  let tab=(location.hash||"#quiz").slice(1);
  if(tab.startsWith("ent-")){ tab="guide"; }
  if(!["quiz","guide","committee"].includes(tab)) tab="quiz";
  if(tab==="committee"&&document.getElementById("tabCommittee").hidden) tab="quiz";
  for(const t of ["quiz","guide","committee"]) document.getElementById("view-"+t).hidden=t!==tab;
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(tab==="guide"){ const h=location.hash.slice(1); if(h.startsWith("ent-")){const d=document.getElementById(h); if(d){d.open=true;d.scrollIntoView();}} }
}
renderGuide(); renderQuiz(); route();
window.addEventListener("hashchange",route);
</script>
