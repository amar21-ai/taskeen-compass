<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوصلة التسكين | صناع الحياة الدقهلية</title>
<meta name="description" content="بوصلة التسكين من صناع الحياة الدقهلية: جاوب على 15 سؤال واعرف أنسب الملفات والمشاريع ليك.">
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: institutional form-and-report. White masthead with the logo, one navy brand band on the start screen,
   a single paper sheet for questions, a report-style results page with hairline rules, navy footer.
   Light theme by choice: the logo is navy on white. */
:root{
  color-scheme:light;
  --navy:#0A4976; --navy-deep:#073655; --navy-tint:#EAF1F7; --navy-line:#C9D8E6;
  --amber:#FBAE42; --amber-ink:#8A5300; --amber-tint:#FFF5E5;
  --bg:#F3F5F8; --paper:#FFFFFF; --ink:#152231; --muted:#5A6779; --line:#DEE4EB;
  --good:#1E7A4C; --good-tint:#E8F4EE; --warn:#9A5800; --warn-tint:#FFF3E0;
  --f-head:"Almarai","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Almarai",Tahoma,"Segoe UI",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
img{max-width:100%;display:block}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:800;margin:0;line-height:1.4;text-wrap:balance}
p{margin:0}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.inner{max-width:880px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.narrow{max-width:720px}

/* masthead */
.masthead{background:var(--paper);border-top:4px solid var(--navy);border-bottom:1px solid var(--line)}
.masthead .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{height:48px;width:auto}
.brand .unit{font-family:var(--f-head);font-weight:700;font-size:.9rem;color:var(--muted);border-inline-start:1px solid var(--line);padding-inline-start:14px;line-height:1.3}
nav.tabs{display:flex;gap:4px}
nav.tabs a{font-family:var(--f-head);font-weight:700;font-size:.92rem;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:6px}
nav.tabs a:hover{color:var(--navy);background:var(--navy-tint)}
nav.tabs a[aria-current="page"]{color:var(--navy);background:var(--navy-tint)}
@media (max-width:600px){.brand .unit{display:none}.brand img{height:40px}nav.tabs a{padding:8px 9px;font-size:.85rem}}

main{padding-block:28px 56px}

/* start screen */
.band{background:var(--navy);color:#fff}
.band .inner{padding-block:48px 52px;display:flex;flex-direction:column;gap:18px}
.kicker{font-family:var(--f-head);font-weight:700;font-size:.85rem;color:var(--amber);letter-spacing:.02em}
.band h1{font-size:clamp(2rem,6vw,3rem);color:#fff}
.band p.lead{font-size:1.1rem;max-width:56ch;color:#DCE7F1}
.facts{display:flex;flex-wrap:wrap;gap:0;margin-top:6px}
.facts div{padding-inline:20px;border-inline-start:1px solid rgba(255,255,255,.22)}
.facts div:first-child{padding-inline-start:0;border:0}
.facts b{display:block;font-family:var(--f-head);font-size:1.5rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.facts span{font-size:.88rem;color:#B9CCDD}
@media (max-width:480px){.facts{flex-direction:column;gap:10px}.facts div{padding:0;border:0}}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
.btn{font-family:var(--f-head);font-weight:700;font-size:1rem;border-radius:6px;padding:12px 26px;border:1px solid transparent;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.4}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-deep)}
.btn-amber{background:var(--amber);color:#2A1A00}
.btn-amber:hover{background:#F5A12A}
.btn-line{background:transparent;color:var(--navy);border-color:var(--navy-line)}
.btn-line:hover{background:var(--navy-tint)}
.btn-onnavy{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-onnavy:hover{background:rgba(255,255,255,.08)}
.btn-text{background:none;border:0;color:var(--muted);padding:12px 6px}
.btn-text:hover{color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.how{padding-block:40px 8px}
.how h2{font-size:1.25rem;margin-bottom:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;counter-reset:s}
.steps li{border-top:2px solid var(--navy);padding-top:14px;counter-increment:s;min-width:0}
.steps li::before{content:counter(s);font-family:var(--f-head);font-weight:800;color:var(--amber-ink);font-size:.95rem;display:block;margin-bottom:4px}
.steps h3{font-size:1.02rem;margin-bottom:4px}
.steps p{color:var(--muted);font-size:.95rem}
@media (max-width:640px){.steps{grid-template-columns:1fr;gap:18px}}
.policy{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.policy .lbl{font-family:var(--f-head);font-weight:700;font-size:.82rem;color:var(--navy);background:var(--navy-tint);padding:3px 10px;border-radius:4px;white-space:nowrap}
.policy p{font-size:.95rem}
@media (max-width:520px){.policy{grid-template-columns:1fr}}

/* question sheet */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet-head{padding:18px 24px 0;display:flex;flex-direction:column;gap:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.88rem;color:var(--muted)}
.meta .sec{font-family:var(--f-head);font-weight:700;color:var(--navy)}
.meta .count{font-variant-numeric:tabular-nums}
.track{display:flex;gap:3px;direction:rtl}
.track i{flex:1;height:4px;background:var(--line);border-radius:2px}
.track i.done{background:var(--navy)}
.track i.now{background:var(--amber)}
.sheet-body{padding:22px 24px 8px;display:flex;flex-direction:column;gap:16px}
.sheet-body h2{font-size:clamp(1.2rem,3.6vw,1.5rem)}
.hint{color:var(--muted);font-size:.93rem;margin-top:-6px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--line);background:#FAFBFC;margin-top:12px}
@media (max-width:480px){.sheet-head,.sheet-body{padding-left:var(--gut);padding-right:var(--gut-r)}.sheet-foot{padding:14px 16px}}

.choices{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:13px 16px;cursor:pointer;border-top:1px solid var(--line);background:var(--paper)}
.choice:first-child{border-top:0}
.choice:hover{background:#F8FAFC}
.choice input{position:absolute;opacity:0;pointer-events:none}
.ind{width:20px;height:20px;border:1.5px solid #9AA8B8;border-radius:50%;margin-top:4px;display:grid;place-items:center;background:#fff}
.choice.multi .ind{border-radius:4px}
.choice:has(input:checked){background:var(--navy-tint)}
.choice:has(input:checked) .ind{border-color:var(--navy);background:var(--navy)}
.choice:has(input:checked) .ind::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.choice.multi:has(input:checked) .ind::after{width:10px;height:6px;border-radius:0;background:none;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.choice:has(input:focus-visible){outline:3px solid var(--amber);outline-offset:-3px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--f-head);font-weight:700;font-size:.9rem}
.field input,.field select{font:inherit;font-size:1rem;padding:10px 12px;border-radius:6px;border:1px solid #C8D1DC;background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus{border-color:var(--navy);outline:2px solid var(--navy-tint);outline-offset:0}
.privacy{font-size:.88rem;color:var(--muted)}

.scale{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.seg{display:flex;direction:ltr;border:1px solid #C8D1DC;border-radius:6px;overflow:hidden}
.seg label{width:38px;height:36px;display:grid;place-items:center;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;border-inline-start:1px solid #C8D1DC;color:var(--muted)}
.seg label:first-child{border:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:hover{background:var(--navy-tint)}
.seg label:has(input:checked){background:var(--navy);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--amber);outline-offset:-3px}
.scale-legend{display:flex;justify-content:flex-end;gap:16px;font-size:.82rem;color:var(--muted)}
@media (max-width:460px){.srow{grid-template-columns:1fr;gap:8px}.seg label{flex:1;width:auto}}
.err{color:#B3261E;font-size:.92rem;font-weight:500}
.below{margin-top:14px;font-size:.9rem;color:var(--muted)}

/* report */
.report-head{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:2px solid var(--navy)}
.report-head h1{font-size:clamp(1.6rem,4.8vw,2.2rem);color:var(--navy)}
.report-head .date{font-size:.88rem;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-top:22px}
.summary>div{padding:16px 20px;min-width:0}
.summary>div+div{border-inline-start:1px solid var(--line)}
.summary .k{font-family:var(--f-head);font-size:.82rem;font-weight:700;color:var(--muted)}
.summary .v{font-family:var(--f-head);font-weight:800;font-size:1.1rem;color:var(--ink)}
.summary .vline{display:flex;align-items:baseline;gap:8px}
.summary .vline+.vline{margin-top:2px}
.summary .vn{font-size:.85rem;color:var(--amber-ink);min-width:12px}
@media (max-width:560px){.summary{grid-template-columns:1fr}.summary>div+div{border-inline-start:0;border-top:1px solid var(--line)}}
.callout{border-radius:6px;padding:12px 16px;font-size:.95rem;margin-top:14px}
.callout b{font-weight:600}
.callout.info{background:var(--navy-tint)}
.callout.good{background:var(--good-tint)}
.callout.warn{background:var(--warn-tint)}
.rsec{margin-top:40px}
.rsec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.rsec-head h2{font-size:1.3rem}
.rsec-head span{font-size:.88rem;color:var(--muted)}
.pick{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;padding:26px 0;border-top:1px solid var(--line)}
.pick:first-of-type{border-top:0}
.pick .num{font-family:var(--f-head);font-weight:800;font-size:2.2rem;line-height:1;color:var(--amber)}
.pick-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.pick-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.pick-top h3{font-size:1.3rem;color:var(--navy)}
.pick-top .en{font-size:.85rem;color:var(--muted);direction:ltr;text-align:right}
.score{text-align:left;grid-row:span 2}
.score b{font-family:var(--f-head);font-weight:800;font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.score span{font-size:.8rem;color:var(--muted)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy)}
.pick .tagline{color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:620px){.cols{grid-template-columns:1fr}.pick{grid-template-columns:36px minmax(0,1fr);gap:12px}.pick .num{font-size:1.6rem}}
.cols h4{font-size:.9rem;color:var(--muted);margin-bottom:6px}
ul.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.ticks li{position:relative;padding-inline-start:18px;font-size:.96rem}
ul.ticks li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:7px;height:7px;background:var(--navy);border-radius:1px}
ul.ticks.plain li::before{background:#AAB6C4}
.others{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);font-size:.95rem}
.orow:first-child{border-top:0}
.orow .t{font-size:.8rem;color:var(--muted);margin-inline-start:6px}
.orow b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);text-align:left}
@media (max-width:420px){.orow{grid-template-columns:minmax(0,1fr) 70px 40px}}
.send{margin-top:40px;background:var(--navy-tint);border:1px solid var(--navy-line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:12px}
.send h2{font-size:1.15rem;color:var(--navy)}
textarea.copy{width:100%;min-height:150px;font:inherit;font-size:.88rem;border-radius:6px;border:1px solid var(--navy-line);background:#fff;color:var(--ink);padding:12px;resize:vertical}
.save-state{font-size:.88rem;color:var(--muted)}

/* guide */
.guide-intro{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:2px solid var(--navy)}
.guide-intro h1{font-size:clamp(1.6rem,4.8vw,2.1rem);color:var(--navy)}
.guide-intro p{max-width:68ch;color:var(--muted)}
.gsec{margin-top:34px}
.gsec h2{font-size:1.2rem;margin-bottom:4px}
.gsec>p{color:var(--muted);font-size:.95rem;margin-bottom:14px}
.glist{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
details.ent{border-top:1px solid var(--line)}
details.ent:first-child{border-top:0}
details.ent summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 20px}
details.ent summary::-webkit-details-marker{display:none}
details.ent summary:hover{background:#F8FAFC}
details.ent summary h3{font-size:1.05rem}
details.ent summary .en{font-size:.82rem;color:var(--muted);font-weight:400;font-family:var(--f-body);margin-inline-start:8px}
details.ent summary .chev{width:10px;height:10px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-left:4px}
details.ent[open] summary .chev{transform:rotate(135deg)}
details.ent[open] summary{background:#F8FAFC}
@media (prefers-reduced-motion:reduce){details.ent summary .chev{transition:none}}
.ent-body{padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.84rem;padding:3px 10px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.src{font-size:.82rem;color:var(--muted)}

/* committee */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:.9rem}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-family:var(--f-head);font-weight:700;color:var(--muted);font-size:.82rem;background:#FAFBFC}

/* footer */
footer.foot{background:var(--navy);color:#C9D8E6}
footer.foot .inner{padding-block:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer.foot img{height:64px;width:auto}
footer.foot .motto{font-family:var(--f-head);font-weight:700;color:var(--amber);font-size:1.1rem}
footer.foot p{font-size:.85rem}
.toast{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:.92rem;z-index:20}
</style>
</head>
<body>
<header class="masthead">
  <div class="inner">
    <a class="brand" href="#quiz" aria-label="صناع الحياة الدقهلية – بوصلة التسكين">
      <img src="logo-mark.png" alt="صناع الحياة – Life Makers Dakahlia" width="91" height="48">
      <span class="unit">لجنة التسكين<br>بوصلة التسكين</span>
    </a>
    <nav class="tabs" aria-label="أقسام الصفحة">
      <a href="#quiz" data-tab="quiz">الأسئلة</a>
      <a href="#guide" data-tab="guide">دليل الملفات</a>
      <a href="#committee" data-tab="committee" id="tabCommittee" hidden>ردود المتطوعين</a>
    </nav>
  </div>
</header>

<div id="view-quiz"></div>
<div id="view-guide" hidden></div>
<div id="view-committee" hidden></div>

<footer class="foot">
  <div class="inner">
    <img src="logo-white.png" alt="مؤسسة صناع الحياة مصر – الدقهلية" width="80" height="64">
    <div>
      <div class="motto">بيت كل متطوع</div>
      <p>مؤسسة صناع الحياة مصر · فرع الدقهلية · لجنة التسكين</p>
    </div>
  </div>
</footer>
<div class="toast" id="toast" hidden></div>

<script>
/*__DATA__*/

/* ============ UI ============ */
const SECTION = {info:"عنك",fav:"عنك",env:"طريقتك في الشغل",friday:"طريقتك في الشغل",skills:"مهاراتك",portfolio:"مهاراتك",
  listen:"مواقف",pressure:"مواقف",kidsQ:"مواقف",inclQ:"مواقف",restaurant:"مواقف",problem:"مواقف",
  causes:"اهتماماتك ووقتك",time:"اهتماماتك ووقتك",urgent:"اهتماماتك ووقتك",commit:"اهتماماتك ووقتك",exp:"اهتماماتك ووقتك"};
let screen = Object.keys(A).length ? "q" : "intro";
const viewQuiz=document.getElementById("view-quiz");

function renderQuiz(){
  if(lastResult){ renderResults(); return; }
  if(screen==="intro"){ renderIntro(); return; }
  const qs=visibleQs(); if(step>=qs.length) step=qs.length-1;
  const q=qs[step];
  let body="";
  if(q.kind==="info"){
    const i=A.info||{};
    const sel=(id,opts,cur)=>`<select id="${id}">${opts.map(([v,t])=>`<option value="${v}" ${cur===v?"selected":""}>${t}</option>`).join("")}</select>`;
    body=`<div class="fields">
      <div class="field"><label for="f-name">الاسم</label><input id="f-name" value="${esc(i.name)}" autocomplete="name"></div>
      <div class="field"><label for="f-phone">رقم الموبايل (واتساب)</label><input id="f-phone" inputmode="tel" dir="ltr" value="${esc(i.phone)}" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label for="f-age">السن</label>${sel("f-age",[["","اختار"],["u17","أقل من 17"],["17-20","من 17 لـ 20"],["21-25","من 21 لـ 25"],["26+","26 أو أكبر"]],i.age)}</div>
      <div class="field"><label for="f-status">انت حاليًا</label>${sel("f-status",[["","اختار"],["school","طالب مدرسة"],["student","طالب جامعة أو معهد"],["grad","خريج"],["work","بشتغل"]],i.status)}</div>
      <div class="field"><label for="f-center">المركز أو المدينة</label><input id="f-center" value="${esc(i.center)}" placeholder="المنصورة، طلخا، ميت غمر..."></div>
    </div><p class="privacy">بياناتك بتوصل للجنة التسكين بس، عشان تتواصل معاك.</p>`;
  } else if(q.kind==="single"||q.kind==="multi"||q.kind==="portfolio"){
    const multi=q.kind!=="single"; const name=q.kind==="portfolio"?"q-portfolio":`q-${q.id}`;
    const cur=q.kind==="portfolio"?(A.portfolio||{types:[]}).types:A[q.id];

function showErr(t){const e=document.getElementById("err"); if(e){e.textContent=t;e.hidden=false;}}
function collect(q,validate){
  if(q.kind==="info"){
    const i={name:val("f-name"),phone:val("f-phone"),age:val("f-age"),status:val("f-status"),center:val("f-center")};
    A.info=i;
    if(validate && (!i.name||!i.age||!i.status)){showErr("اكتب اسمك واختار سنك وانت بتعمل إيه حاليًا.");return false;}
    return true;
  }
  if(q.kind==="single"){ const c=viewQuiz.querySelector(`input[name="q-${q.id}"]:checked`); if(c) A[q.id]=c.value;
    if(validate&&!c){showErr("اختار إجابة عشان نكمل.");return false;} return true;}
  if(q.kind==="multi"){ A[q.id]=[...viewQuiz.querySelectorAll(`input[name="q-${q.id}"]:checked`)].map(x=>x.value);
    if(validate&&q.id!=="commit"&&!A[q.id].length){showErr("اختار حاجة واحدة على الأقل.");return false;} return true;}
  if(q.kind==="scale"){ const o={}; for(const it of q.items){const c=viewQuiz.querySelector(`input[name="s-${it.d}"]:checked`); if(c) o[it.d]=+c.value;}
    A[q.id]=o; if(validate&&Object.keys(o).length<q.items.length){showErr("قيّم نفسك في كل المهارات.");return false;} return true;}
  if(q.kind==="portfolio"){ A.portfolio={types:[...viewQuiz.querySelectorAll(`input[name="q-portfolio"]:checked`)].map(x=>x.value),link:val("f-link")}; return true;}
  return true;
}

/* ============ SAVE + COMMITTEE (works only inside Claude) ============ */
let db=null, user=null, uid=null, saveStatus="pending";
(async()=>{
  try{ if(!window.claude||!window.claude.use){saveStatus="off";updateSaveState();return;}
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){ try{uid=await user.id();}catch(e){} }
    if(!db||!uid){saveStatus="off";updateSaveState();return;}
    saveStatus="ready"; if(lastResult) saveSubmission(); else updateSaveState();
    let admin=false; try{admin=await user.canEdit();}catch(e){}
    if(admin){ document.getElementById("tabCommittee").hidden=false; startCommittee(); }
  }catch(e){saveStatus="off";updateSaveState();}
})();
async function saveSubmission(){
  if(!lastResult) return;
  if(!db||!uid){ if(saveStatus!=="pending") saveStatus="off"; updateSaveState(); return; }
  saveStatus="saving"; updateSaveState();
  const R=lastResult;
  const doc={info:A.info||{},fav:A.fav||null,portfolio:A.portfolio||null,answers:A,
    topFiles:R.topFiles.map(r=>({id:r.id,pct:r.pct})),topProjects:R.topProjects.map(r=>({id:r.id,pct:r.pct})),
    allScores:Object.fromEntries(R.files.concat(R.projects).map(r=>[r.id,r.pct])),
    flags:R.flags,confidence:Math.round(R.confidence*100),at:R.at};
  try{ await db.collection("submissions").doc(uid).set(doc); saveStatus="saved"; } catch(e){ saveStatus="error"; }
  updateSaveState();
}
function updateSaveState(){
  const el=document.getElementById("saveState"); if(!el) return;
  el.textContent = {saved:"ترشيحاتك اتحفظت ولجنة التسكين تقدر تشوفها. ولو حابب، ابعت الملخص كمان على جروب المتابعة.",
    saving:"جاري الحفظ..."}[saveStatus] || "انسخ الملخص ده وابعته على جروب المتابعة أو لمسؤول التسكين.";
}
let committeeRows=[], committeeState="loading";
function startCommittee(){
  const t=setTimeout(()=>{ if(committeeState==="loading"){committeeState="slow";renderCommittee();} },10000);
  db.collection("submissions").onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(t);
    committeeRows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||"").localeCompare(a.at||""));
    committeeState=snap.metadata.fromCache?"cached":"live"; renderCommittee();
  },()=>{clearTimeout(t);committeeState="error";renderCommittee();});
  renderCommittee();
}
function renderCommittee(){
  const v=document.getElementById("view-committee"); const rows=committeeRows;
  const counts={}; rows.forEach(r=>(r.topFiles||[]).slice(0,1).forEach(f=>counts[f.id]=(counts[f.id]||0)+1));
  const status={loading:"جاري تحميل الردود...",slow:"الردود لسه مش واصلة، ممكن تكون قديمة.",cached:"نسخة محفوظة، جاري التحديث...",live:"",error:"مقدرناش نجيب الردود دلوقتي."}[committeeState];
  v.innerHTML=`<main><div class="inner">
   <header class="guide-intro"><span class="kicker" style="color:var(--amber-ink)">لجنة التسكين</span><h1>ردود المتطوعين</h1><p>${toArabicNum(rows.length)} متطوع جاوبوا. ${status}</p></header>
   ${rows.length?`<section class="rsec"><div class="rsec-head"><h2>توزيع أول ترشيح</h2><span>الحد: ملف واحد ميزيدش عن ٢٥٪</span></div>
     <div class="others">${ENT.filter(e=>e.type==="file").map(e=>{const c=counts[e.id]||0;const p=Math.round(c/rows.length*100);return `<div class="orow"><span>${esc(e.name)}</span><div class="meter"><i style="width:${p}%;${p>25?"background:var(--amber)":""}"></i></div><b>${toArabicNum(c)}</b></div>`}).join("")}</div></section>
   <div class="actions" style="margin-top:20px"><button class="btn btn-line" id="copyTsv" type="button">انسخ كجدول لـ Google Sheets</button></div>
   <textarea class="copy" id="tsv" readonly hidden style="margin-top:12px"></textarea>
   <div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الموبايل</th><th>السن · المركز</th><th>أنسب 3 ملفات</th><th>أنسب مشروعين</th><th>كان في دماغه</th><th>التاريخ</th></tr></thead><tbody>
    ${rows.map(r=>{const i=r.info||{};return `<tr><td>${esc(i.name)}</td><td dir="ltr">${esc(i.phone)}</td><td>${esc(i.age)} · ${esc(i.center)}</td>
      <td>${(r.topFiles||[]).map(f=>`${esc(byId[f.id]?.name)} <span style="color:var(--muted)">${toArabicNum(f.pct)}٪</span>`).join("<br>")}</td>
      <td>${(r.topProjects||[]).map(f=>`${esc(byId[f.id]?.name)} <span style="color:var(--muted)">${toArabicNum(f.pct)}٪</span>`).join("<br>")}</td>
      <td>${r.fav&&r.fav!=="none"?esc(byId[r.fav]?.name):"-"}${r.portfolio&&r.portfolio.link?`<br><a href="${esc(r.portfolio.link)}" target="_blank" rel="noopener">أعماله</a>`:""}</td>
      <td>${r.at?new Date(r.at).toLocaleDateString("ar-EG"):""}</td></tr>`}).join("")}</tbody></table></div>`
   :`<p style="margin-top:20px;color:var(--muted)">لسه مفيش ردود. أول ما متطوع يخلص الأسئلة، نتيجته هتظهر هنا.</p>`}
  </div></main>`;
  const b=document.getElementById("copyTsv"); if(b) b.onclick=()=>{
    const head=["الاسم","الموبايل","السن","الحالة","المركز","ملف 1","ملف 2","ملف 3","مشروع 1","مشروع 2","كان في دماغه","التاريخ"];
    const lines=rows.map(r=>{const i=r.info||{};const tf=r.topFiles||[],tp=r.topProjects||[];
      return [i.name,i.phone,i.age,i.status,i.center,...[0,1,2].map(k=>tf[k]?`${byId[tf[k].id]?.name} ${tf[k].pct}%`:""),...[0,1].map(k=>tp[k]?`${byId[tp[k].id]?.name} ${tp[k].pct}%`:""),r.fav&&r.fav!=="none"?byId[r.fav]?.name:"",r.at||""].map(x=>String(x??"").replace(/\t|\n/g," ")).join("\t");});
    const t=[head.join("\t")].concat(lines).join("\n"); const ta=document.getElementById("tsv"); ta.value=t; ta.hidden=false; copyText(t,ta);
  };
}

/* ============ ROUTING ============ */
function route(){
  let tab=(location.hash||"#quiz").slice(1);
  if(tab.startsWith("ent-")) tab="guide";
  if(!["quiz","guide","committee"].includes(tab)) tab="quiz";
  if(tab==="committee"&&document.getElementById("tabCommittee").hidden) tab="quiz";
  for(const t of ["quiz","guide","committee"]) document.getElementById("view-"+t).hidden=t!==tab;
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const h=location.hash.slice(1);
  if(h.startsWith("ent-")){const d=document.getElementById(h); if(d){d.open=true;d.scrollIntoView();}}
  else window.scrollTo({top:0});
}
renderGuide(); renderQuiz(); route();
window.addEventListener("hashchange",route);
</script>
